<!doctype html>

    <meta name="theme-color" content="#060b1f" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* apply saved theme and language before first paint */
      try {
        var t = localStorage.getItem("zedera-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        var l = localStorage.getItem("zedera-lang");
        if (l === "am") document.documentElement.lang = "am";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>

    <title>Zedera Tech Solutions | Websites, Apps, Business Systems &amp; AI in Ethiopia</title>
